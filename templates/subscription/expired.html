{% extends 'base.html' %}
{% block title %}Subscription Expired{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:70vh;">
    <div class="glass-card" style="text-align:center;max-width:460px;width:100%;padding:48px;">
        <div style="font-size:64px;margin-bottom:16px;">🔒</div>
        <h2 style="font-size:24px;font-weight:800;margin-bottom:10px;">Subscription Expired</h2>
        <p style="color:var(--text-secondary);margin-bottom:28px;line-height:1.6;">
            Your 30-day free trial or subscription has expired.<br>Please renew to continue accessing the dashboard.
        </p>
        <a href="{% url 'subscription:activate' %}" class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:12px;">
            👑 Renew Subscription
        </a>
        <a href="{% url 'accounts:logout' %}" class="btn btn-glass" style="width:100%;justify-content:center;">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</div>
{% endblock %}
